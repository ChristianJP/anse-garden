<script>
/*
  anse.garden
  The growing garden is a remix of Type Garden by Akshat Agarwal (type-garden.vercel.app),
  rebuilt as plain canvas + JavaScript from the source he shares for remixing.
  White flowers and birds on green for anse.garden.
*/
(() => {
'use strict';

const NAME = 'anse.garden';
const params = new URLSearchParams(location.search);

// The two looks it cuts between. Each background has its own type colour.
// line = the drawing inside petals and leaves (cut out in the background colour)
const STYLES = [
  { id: 'white', bg: '#000000', flower: '#F2F2F2', stem: '#6E6E6E', line: '#000000', text: '#FFFFFF' },
  { id: 'beige', bg: '#FF1400', flower: '#FFF1E0', stem: '#0B0B0B', line: '#FF1400', text: '#000000' }
];
const CUT_MS = 4000;      // a hard cut between the looks this often
// With ASCII on, the garden is drawn in these instead: one channel per part, so every cell knows
// how much type, flower and stem it holds, whatever the look's colours are.
const MATERIAL = { bg: '#000000', C: { text: '#FF0000', flower: '#00FF00', stem: '#0000FF', line: '#000000', vein: '#000000' } };
const ASCII_ON = params.get('ascii') !== '0';
const POSTS_URL = params.get('posts') || 'posts.json'; // the portfolio's work list (?posts= swaps in a test list)
const IG_URL = 'https://www.instagram.com/ansegarden/';
// character cells in device pixels: about 8-9px tall on a laptop, 6px on a phone (?cell= sets it, for stills)
const cellSize = (W, H, dpr) => {
  const want = parseFloat(params.get('cell')) || Math.max(6, Math.min(9, Math.min(W, H) / 105));
  const ch = Math.max(8, Math.round(want * dpr));
  return { cw: Math.max(5, Math.round(ch * 0.6)), ch };
};

// ---------- ASCII ----------
// The garden is drawn into a small canvas with one pixel per character cell, and the canvas's own
// antialiasing leaves each pixel the average of what fell in its cell. A WebGL pass then writes every
// cell as a character: how much ink the cell holds picks the glyph (a ramp sorted by measured ink),
// which part it is (type, flower or stem) picks the ramp and the look's colour. Glyphs are stamped from a mask atlas,
// so the whole screen costs one draw. The ramp is ascii-magic-art's "ASCII" look
// (MIT License, Copyright (c) 2026 ASCII Magic, ascii-magic.com), split into a ramp per part.
class Ascii {
  constructor(canvas) {
    const gl = canvas.getContext('webgl', { antialias: false, alpha: false, depth: false, stencil: false, premultipliedAlpha: false, preserveDrawingBuffer: false });
    if (!gl) throw new Error('no webgl');
    this.c = canvas; this.gl = gl; this.ok = true;
    // one ramp per part, each sorted light to dark by the ink it really puts down:
    // square for the type, round for the flowers, light strokes for stems and leaves
    this.ramps = [' .:-=+*x%#', ' .,:;~*oO@', ' .,-~:;=+*'].map(r => [...r]);
    canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); this.ok = false; });
    const vs = 'attribute vec2 p; void main() { gl_Position = vec4(p, 0.0, 1.0); }';
    const fs = `#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform sampler2D uScene;
uniform sampler2D uAtlas;
uniform vec2 uRes;
uniform vec2 uCell;
uniform vec2 uGrid;
uniform vec2 uAtlasPx;
uniform float uN;
uniform float uGamma;
uniform vec3 uBg;
uniform vec3 uText;
uniform vec3 uFlower;
uniform vec3 uStem;
uniform sampler2D uGlyph;
uniform float uGlyphOn;
void main() {
  vec2 p = vec2(gl_FragCoord.x - 0.5, uRes.y - gl_FragCoord.y - 0.5);
  vec2 cell = floor(p / uCell);
  vec2 inC = p - cell * uCell;
  // characters placed outright (the portfolio's box) win over the garden
  if (uGlyphOn > 0.5) {
    float gi = floor(texture2D(uGlyph, (cell + 0.5) / uGrid).r * 255.0 + 0.5);
    if (gi > 0.5) {
      float b = texture2D(uAtlas, vec2(gi * uCell.x + inC.x + 0.5, 3.0 * uCell.y + inC.y + 0.5) / uAtlasPx).a;
      gl_FragColor = vec4(mix(uBg, uText, b), 1.0);
      return;
    }
  }
  // r = type, g = flowers, b = stems: how much of this cell each covers
  vec3 m = texture2D(uScene, (cell + 0.5) / uGrid).rgb;
  float cov = min(1.0, m.r + m.g + m.b);
  float row = 2.0; vec3 col = uStem;
  if (m.r >= m.g && m.r >= m.b) { row = 0.0; col = uText; }
  else if (m.g >= m.b) { row = 1.0; col = uFlower; }
  float g = floor(pow(cov, uGamma) * (uN - 1.0) + 0.5);
  float a = texture2D(uAtlas, vec2(g * uCell.x + inC.x + 0.5, row * uCell.y + inC.y + 0.5) / uAtlasPx).a;
  gl_FragColor = vec4(mix(uBg, col, a), 1.0);
}`;
    const sh = (type, src) => { const o = gl.createShader(type); gl.shaderSource(o, src); gl.compileShader(o); if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(o)); return o; };
    const pr = gl.createProgram();
    gl.attachShader(pr, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(pr); if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(pr));
    gl.useProgram(pr); this.pr = pr;
    this.u = {}; for (const k of ['uScene', 'uAtlas', 'uRes', 'uCell', 'uGrid', 'uAtlasPx', 'uN', 'uGamma', 'uBg', 'uText', 'uFlower', 'uStem', 'uGlyph', 'uGlyphOn']) this.u[k] = gl.getUniformLocation(pr, k);
    const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(pr, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    const tex = unit => { const t = gl.createTexture(); gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, t);
      for (const [k, v] of [[gl.TEXTURE_MIN_FILTER, gl.NEAREST], [gl.TEXTURE_MAG_FILTER, gl.NEAREST], [gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE]]) gl.texParameteri(gl.TEXTURE_2D, k, v);
      return t; };
    this.tScene = tex(0); this.tAtlas = tex(1); this.tGlyph = tex(2);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false); gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
    gl.pixelStorei(gl.UNPACK_COLORSPACE_CONVERSION_WEBGL, gl.NONE);
    gl.uniform1i(this.u.uScene, 0); gl.uniform1i(this.u.uAtlas, 1); gl.uniform1i(this.u.uGlyph, 2);
    gl.uniform1f(this.u.uGamma, 0.9); gl.uniform1f(this.u.uGlyphOn, 0);
  }
  // character cells in device pixels; returns the size of the small canvas the garden is drawn into
  size(W, H, dpr) {
    const { cw, ch } = cellSize(W, H, dpr);
    const Wd = Math.round(W * dpr), Hd = Math.round(H * dpr);
    this.c.width = Wd; this.c.height = Hd;
    this.cw = cw; this.ch = ch; this.cols = Math.ceil(Wd / cw); this.rows = Math.ceil(Hd / ch);
    this.sx = dpr / cw; this.sy = dpr / ch; // page pixels -> small-canvas pixels
    if (this.atlasKey !== cw + 'x' + ch) this.atlas(cw, ch);
    const gl = this.gl;
    gl.viewport(0, 0, Wd, Hd);
    gl.uniform2f(this.u.uRes, Wd, Hd); gl.uniform2f(this.u.uCell, cw, ch); gl.uniform2f(this.u.uGrid, this.cols, this.rows);
    return { cols: this.cols, rows: this.rows };
  }
  // every glyph once, white on clear: a row per ramp, light to dark by the ink it actually puts down
  atlas(cw, ch) {
    const R = this.ramps, n = R[0].length, cv = document.createElement('canvas');
    cv.width = cw * n; cv.height = ch * (R.length + 1);
    const g = cv.getContext('2d', { willReadFrequently: true });
    g.font = `500 ${Math.round(ch * 0.8)}px "DM Mono", ui-monospace, Menlo, monospace`;
    g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = '#fff';
    const ink = c => {
      g.clearRect(0, 0, cw, ch); g.fillText(c, cw / 2, ch * 0.55);
      const px = g.getImageData(0, 0, cw, ch).data; let s = 0;
      for (let i = 3; i < px.length; i += 4) s += px[i];
      return s;
    };
    const rows = R.map(r => { const k = r.map(ink); return r.map((c, i) => i).sort((a, b) => k[a] - k[b]).map(i => r[i]); });
    rows.push([' ', '+', '-', '|'].concat(Array(Math.max(0, n - 4)).fill(' '))); // the box: 1 '+', 2 '-', 3 '|'
    g.clearRect(0, 0, cv.width, cv.height);
    rows.forEach((r, y) => r.forEach((c, i) => g.fillText(c, i * cw + cw / 2, y * ch + ch * 0.55)));
    const gl = this.gl;
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, this.tAtlas);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, cv);
    gl.uniform2f(this.u.uAtlasPx, cv.width, cv.height); gl.uniform1f(this.u.uN, n);
    this.atlasKey = cw + 'x' + ch;
  }
  // characters placed outright, one byte per cell (0 = the garden shows through); null turns them off
  glyphs(arr) {
    const gl = this.gl;
    if (!arr) { gl.uniform1f(this.u.uGlyphOn, 0); return; }
    gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, this.tGlyph);
    gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.LUMINANCE, this.cols, this.rows, 0, gl.LUMINANCE, gl.UNSIGNED_BYTE, arr);
    gl.uniform1f(this.u.uGlyphOn, 1);
  }
  draw(scene, st) {
    const gl = this.gl;
    if (!this.ok || gl.isContextLost()) return false;
    const rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, this.tScene);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, scene);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, this.tAtlas);
    gl.uniform3fv(this.u.uBg, rgb(st.bg));
    gl.uniform3fv(this.u.uText, rgb(st.text)); gl.uniform3fv(this.u.uFlower, rgb(st.flower)); gl.uniform3fv(this.u.uStem, rgb(st.stem));
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    return true;
  }
}

class Garden {
  constructor() {
    this.app = document.getElementById('app');
    this.cv = document.getElementById('cv');
    this.inp = document.getElementById('inp');
    this.g = this.cv.getContext('2d');
    this.F = '"Playfair Display", Georgia, serif';
    this.SENT = String.fromCharCode(0x200b); // kept in the hidden field so Backspace on an empty field still reports
    this.og = params.has('og');
    if (this.og) document.documentElement.classList.add('og');
    const reduce = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
    this.opt = { boil: !reduce, recoil: 20, density: 1, wither: 260 };

    this.letters = []; this.uid = 1; this.cache = {}; this.Sd = 0; this.St = 0; this.wrapped = false;
    this.t0 = performance.now(); this.lastKey = 0; this.rand = Math.random;
    this.fa = {}; this.mx = null; this.my = null; this.birds = []; this.perch = [];
    this.intro = null; this.nextAmbient = 0;
    this.pf = { open: false, full: -1, t0: 0, shown: -1, done: false }; this.posts = null; this.table = null;

    this.pi = params.get('look') === 'beige' ? 1 : 0;
    this.lastCut = performance.now();
    this.applyPalette();
    this.sc = document.createElement('canvas'); // the garden drawn small, one pixel per character
    this.sg = this.sc.getContext('2d');
    this.ascii = null;
    if (ASCII_ON) { try { this.ascii = new Ascii(document.getElementById('gl')); } catch (e) { this.ascii = null; } }
    document.documentElement.toggleAttribute('data-ascii', !!this.ascii);
    this.FW = this.ascii ? 900 : 700; // the letters' weight: black when they're made of characters

    this.onResize = () => this.resize();
    window.addEventListener('resize', this.onResize);
    this.resize();

    window.addEventListener('keydown', e => this.key(e));
    window.addEventListener('pointermove', e => { this.mx = e.clientX; this.my = e.clientY; });
    document.addEventListener('mouseout', e => { if (!e.relatedTarget) this.mx = null; });
    window.addEventListener('pointerup', e => { if (e.pointerType && e.pointerType !== 'mouse') this.mx = null; }); // flowers relax when the finger lifts
    window.addEventListener('pointercancel', () => { this.mx = null; });

    // ---------- phone ----------
    this.touch = !!(window.matchMedia && matchMedia('(pointer: coarse)').matches);
    if (this.touch) document.documentElement.setAttribute('data-touch', '');
    this.ptype = 'mouse';
    window.addEventListener('pointerdown', e => { this.ptype = e.pointerType || 'mouse'; }, true);
    this.app.addEventListener('pointerdown', e => this.press(e));

    const fld = this.inp;
    this.iv = this.SENT; fld.value = this.SENT;
    fld.addEventListener('input', () => this.inputDiff(fld));
    fld.addEventListener('compositionstart', () => { this.composing = true; });
    fld.addEventListener('compositionend', () => { this.composing = false; setTimeout(() => { if (!this.composing) this.inputDiff(fld); }, 0); });
    this.vv = window.visualViewport || null; this.vvMax = 0;
    if (this.vv && this.touch) { const f = () => this.syncVV(); this.vv.addEventListener('resize', f); this.vv.addEventListener('scroll', f); this.syncVV(); }
    if (params.has('debug')) window.__garden = this;

    // ---------- portfolio ----------
    this.btn = document.querySelector('.pf'); this.worksEl = document.querySelector('.works'); this.fullEl = document.querySelector('.full');
    this.btn.addEventListener('click', e => { e.stopPropagation(); if (this.pf.full >= 0) this.closeFull(); else if (this.pf.open) this.closePortfolio(); else this.openPortfolio(); });
    this.fullEl.addEventListener('click', e => { if (!e.target.closest('a')) this.closeFull(); });
    const nav = () => { const want = location.hash === '#portfolio'; if (want && !this.pf.open) this.openPortfolio(true); else if (!want && this.pf.open) this.closePortfolio(true); };
    window.addEventListener('popstate', nav); window.addEventListener('hashchange', nav);
    if (location.hash === '#portfolio') this.openPortfolio(true);

    // grow the name once the letters' font is in
    let started = false;
    const go = () => { if (started) return; started = true; this.cache = {}; this.layout(true); this.startIntro(this.og ? 0 : 450); };
    if (document.fonts && document.fonts.load) {
      document.fonts.load(`${this.FW} 100px ${this.F}`).then(go, go);
      document.fonts.load('500 20px "DM Mono"').then(() => { if (this.ascii) { this.ascii.atlasKey = null; this.resize(); } }, () => {});
    }
    setTimeout(go, 2500);

    const loop = () => { this.raf = requestAnimationFrame(loop); this.frame(); };
    loop();
    if (!this.touch) setTimeout(() => this.inp.focus({ preventScroll: true }), 50);
  }

  // ---------- colours ----------
  applyPalette() {
    const p = STYLES[this.pi], ds = document.documentElement.style;
    ds.setProperty('--bg', p.bg); ds.setProperty('--fg', p.text);
    const m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute('content', p.bg);
  }
  pal() { const p = STYLES[this.pi] || STYLES[0]; return { bg: p.bg, C: { flower: p.flower, stem: p.stem, line: p.line, text: p.text, vein: p.line } }; }

  // ---------- math ----------
  h(n) { const x = Math.sin(n) * 43758.5453; return x - Math.floor(x); }
  spr(t, k = 7, w = 16) { if (t <= 0) return 0; return 1 - Math.exp(-t * k) * Math.cos(t * w); }
  eo(t) { if (t <= 0) return 0; if (t >= 1) return 1; return 1 - Math.pow(1 - t, 3); }
  rng(seed) {
    let s = seed | 0;
    return () => { s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
  bez(a, b, c, d, n) {
    const P = [];
    for (let i = 0; i <= n; i++) { const t = i / n, u = 1 - t;
      P.push([u*u*u*a[0] + 3*u*u*t*b[0] + 3*u*t*t*c[0] + t*t*t*d[0], u*u*u*a[1] + 3*u*u*t*b[1] + 3*u*t*t*c[1] + t*t*t*d[1]]); }
    return P;
  }
  at(P, u) {
    const n = P.length; const i = Math.min(n - 2, Math.max(1, Math.round(u * (n - 1))));
    return [P[i], Math.atan2(P[i+1][1] - P[i-1][1], P[i+1][0] - P[i-1][0])];
  }
